<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { font-family: 'Heebo', 'Arial Hebrew', Arial, sans-serif; background: #F0F4FF; min-height: 100vh; direction: rtl; font-size: 16px; }

  .header { background: linear-gradient(135deg, #0C4A6E 0%, #0EA5E9 100%); padding: 18px 16px 14px; color: white; position: sticky; top: 0; z-index: 100; box-shadow: 0 2px 12px rgba(0,0,0,0.15); }
  .header-inner { max-width: 640px; margin: 0 auto; display: flex; justify-content: space-between; align-items: center; }
  .header h1 { font-size: 24px; font-weight: 700; }
  .header p { font-size: 15px; opacity: 0.75; margin-top: 2px; }
  .btn-export { background: rgba(255,255,255,0.2); color: white; border: 1px solid rgba(255,255,255,0.5); border-radius: 10px; padding: 10px 16px; font-weight: 600; font-size: 15px; cursor: pointer; font-family: inherit; }
  .btn-export:hover { background: rgba(255,255,255,0.3); }
  .btn-add { background: white; color: #0C4A6E; border: none; border-radius: 10px; padding: 10px 16px; font-weight: 700; font-size: 15px; cursor: pointer; font-family: inherit; }

  .main { max-width: 640px; margin: 0 auto; padding: 14px 12px 80px; }

  .filters { display: flex; gap: 6px; margin-bottom: 12px; flex-wrap: wrap; }
  .filter-btn { padding: 7px 14px; border-radius: 20px; border: none; cursor: pointer; font-size: 15px; font-family: inherit; background: #E2E8F0; color: #374151; transition: all 0.15s; }
  .filter-btn.active { background: #0EA5E9; color: white; font-weight: 600; }

  .toolbar { display: flex; gap: 8px; margin-bottom: 12px; align-items: center; flex-wrap: wrap; }
  .btn-sm { padding: 7px 14px; border-radius: 8px; font-size: 15px; cursor: pointer; font-family: inherit; border: none; }
  .btn-outline-blue { background: white; border: 1px solid #0EA5E9; color: #0EA5E9; }
  .btn-outline-red  { background: white; border: 1px solid #EF4444; color: #EF4444; }
  .btn-solid-blue   { background: #0EA5E9; border: none; color: white; font-weight: 700; }

  .flights-list { display: flex; flex-direction: column; gap: 8px; }

  .flight-card { background: white; border-radius: 12px; border: 2px solid transparent; box-shadow: 0 1px 4px rgba(0,0,0,0.06); transition: all 0.12s; }
  .flight-card.selected { border-color: #0EA5E9; box-shadow: 0 0 0 4px rgba(14,165,233,0.08); }
  .flight-card.past { opacity: 0.65; }
  .card-body { padding: 12px 14px; display: flex; gap: 10px; align-items: flex-start; }

  .checkbox { width: 22px; height: 22px; border-radius: 5px; border: 2px solid #CBD5E1; background: white; flex-shrink: 0; margin-top: 3px; cursor: pointer; display: flex; align-items: center; justify-content: center; transition: all 0.12s; }
  .checkbox.checked { background: #0EA5E9; border-color: #0EA5E9; }
  .checkbox.checked::after { content: '✓'; color: white; font-size: 14px; line-height: 1; }

  .card-content { flex: 1; cursor: pointer; min-width: 0; }
  .card-top { display: flex; flex-wrap: wrap; align-items: center; gap: 6px; margin-bottom: 4px; }
  .card-date { font-weight: 700; font-size: 18px; color: #0C4A6E; }
  .badge { font-size: 13px; padding: 3px 9px; border-radius: 10px; font-weight: 500; border: 1px solid; }
  .dur-badge { font-size: 13px; padding: 3px 8px; border-radius: 10px; background: #F0F9FF; color: #0369A1; }
  .card-contact { font-size: 16px; color: #111827; }
  .card-contact span { color: #64748B; font-size: 15px; }
  .card-options { font-size: 14px; color: #7C3AED; margin-top: 2px; }
  .card-notes { font-size: 13px; color: #9CA3AF; margin-top: 3px; font-style: italic; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }

  .card-actions { display: flex; flex-direction: column; gap: 5px; flex-shrink: 0; }
  .icon-btn { background: #F0F9FF; border: none; border-radius: 7px; padding: 6px 10px; cursor: pointer; font-size: 16px; line-height: 1; text-decoration: none; display: block; text-align: center; }
  .icon-btn:hover { background: #E0F2FE; }

  .save-indicator { position: fixed; bottom: 20px; left: 50%; transform: translateX(-50%); background: #0C4A6E; color: white; padding: 10px 20px; border-radius: 20px; font-size: 15px; font-family: inherit; z-index: 999; opacity: 0; transition: opacity 0.3s; pointer-events: none; }
  .save-indicator.visible { opacity: 1; }

  .modal-overlay { display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.45); z-index: 200; align-items: flex-end; justify-content: center; }
  .modal-overlay.open { display: flex; }
  .modal { background: white; border-radius: 20px 20px 0 0; padding: 20px 16px 32px; width: 100%; max-width: 640px; max-height: 90vh; overflow-y: auto; }
  .modal-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 16px; }
  .modal-title { font-size: 20px; font-weight: 700; color: #0C4A6E; }
  .modal-close { background: #F1F5F9; border: none; border-radius: 50%; width: 34px; height: 34px; cursor: pointer; font-size: 20px; display: flex; align-items: center; justify-content: center; }

  .form-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
  .form-full { grid-column: 1 / -1; }
  .field label { display: block; font-size: 14px; font-weight: 600; color: #374151; margin-bottom: 4px; }
  .field input, .field select, .field textarea { width: 100%; padding: 9px 11px; border-radius: 8px; border: 1px solid #D1D5DB; font-size: 16px; font-family: inherit; background: white; color: #111827; outline: none; direction: rtl; }

  .form-actions { display: flex; gap: 10px; margin-top: 18px; }
  .btn-save { flex: 1; padding: 13px; border-radius: 10px; border: none; cursor: pointer; background: #0EA5E9; color: white; font-weight: 700; font-size: 17px; font-family: inherit; }
  .btn-save:disabled { background: #CBD5E1; cursor: not-allowed; }
  .btn-delete { padding: 13px 16px; border-radius: 10px; border: none; cursor: pointer; background: #FEE2E2; color: #DC2626; font-weight: 700; font-size: 16px; font-family: inherit; }

  .send-panel { display: none; position: fixed; inset: 0; background: white; z-index: 300; overflow-y: auto; }
  .send-panel.open { display: block; }
  .send-header { background: linear-gradient(135deg, #0C4A6E, #0EA5E9); padding: 16px; color: white; display: flex; align-items: center; gap: 12px; position: sticky; top: 0; }
  .send-back { background: rgba(255,255,255,0.2); border: none; color: white; border-radius: 8px; padding: 7px 14px; cursor: pointer; font-size: 16px; font-family: inherit; }
  .send-body { max-width: 600px; margin: 0 auto; padding: 16px; }
  .msg-preview { background: #F8FAFC; border: 1px solid #E2E8F0; border-radius: 10px; padding: 14px; font-size: 16px; line-height: 1.9; color: #1E293B; white-space: pre-wrap; direction: rtl; text-align: right; margin-bottom: 14px; font-family: inherit; }
  .send-btns { display: flex; gap: 10px; flex-wrap: wrap; }
  .btn-copy { padding: 11px 22px; border-radius: 10px; border: none; cursor: pointer; background: #0EA5E9; color: white; font-weight: 700; font-size: 16px; font-family: inherit; }
  .btn-copy.copied { background: #16A34A; }
  .btn-wa { padding: 11px 22px; border-radius: 10px; text-decoration: none; background: #25D366; color: white; font-weight: 700; font-size: 16px; font-family: inherit; display: inline-block; }
  .send-section-title { font-size: 15px; font-weight: 700; color: #0C4A6E; margin: 18px 0 8px; }

  .empty { text-align: center; color: #9CA3AF; padding: 40px 20px; font-size: 17px; }
  .footer-hint { text-align: center; color: #CBD5E1; font-size: 14px; margin-top: 16px; }

  @media (max-width: 640px) {
    body { font-size: 18px; }
    .header h1 { font-size: 28px; }
    .header p { font-size: 17px; }
    .btn-export, .btn-add { font-size: 17px; padding: 12px 18px; }
    .filter-btn { font-size: 17px; padding: 9px 16px; }
    .btn-sm { font-size: 17px; padding: 9px 16px; }
    .card-date { font-size: 22px; }

    .dur-badge { font-size: 15px; padding: 4px 9px; }

    .card-contact span { font-size: 17px; }
    .card-options { font-size: 16px; }
    .card-notes { font-size: 15px; }
    .icon-btn { font-size: 20px; padding: 8px 13px; }
    .modal-title { font-size: 22px; }
    .field label { font-size: 16px; }
    .field input, .field select, .field textarea { font-size: 18px; padding: 11px 12px; }
    .toggle-opt { font-size: 17px; padding: 11px 0; }
    .opt-name { font-size: 17px; }
    .opt-item { padding: 11px 12px; }
    .custom-add-row input, .custom-add-row button { font-size: 17px; padding: 10px 14px; }
    .btn-save { font-size: 19px; padding: 15px; }
    .btn-delete { font-size: 18px; padding: 15px 18px; }
    .send-back { font-size: 18px; padding: 9px 16px; }
    .msg-preview { font-size: 18px; line-height: 2; }
    .btn-copy, .btn-wa { font-size: 18px; padding: 13px 24px; }
    .empty { font-size: 19px; }
    .footer-hint { font-size: 16px; }

    .modal-close { width: 38px; height: 38px; font-size: 22px; }

</style>

</div>

<div class="main">

<!-- Save indicator -->

<!-- Add/Edit Modal -->
<div class="modal-overlay" id="modal" onclick="if(event.target===this)closeModal()">

      <div class="field form-full"><label>זמן טיסה (דקות)</label>

          <button class="toggle-opt" data-d="30" onclick="setDuration(30)">30</button>

      <div class="field form-full"><label>מספר טיסות</label>

          <button class="toggle-opt" data-c="2" onclick="setCount(2)">2</button>
          <button class="toggle-opt" data-c="3" onclick="setCount(3)">3</button>

<script>
const STORAGE_KEY = 'ufly_flights_data';
const SETTINGS_KEY = 'ufly_flights_settings';

let GITHUB_TOKEN = localStorage.getItem('gh_token') || '';
const GITHUB_REPO = 'Nunah31/Ufly-Flights';
const DATA_FILE = 'flights_data.json';
let fileSha = null;
const SETTINGS_FILE = 'settings_data.json';
let settingsSha = null;

const GOOGLE_CLIENT_ID = '445601042786-j4f64beftudtg0nlcdg1kuqp0k08amqo.apps.googleusercontent.com';
const CALENDAR_SCOPE   = 'https://www.googleapis.com/auth/calendar.events';
let gAccessToken = null;
let tokenClient  = null;

const OPTIONS_CFG = [
  { key: 'photo',    label: '📷 צילום' },
  { key: 'photo360', label: '🎥 צילום 360' },
  { key: 'pilotDay', label: '🧑‍✈️ טייס ליום אחד' },
];

const BASE_PILOTS = ['דור', 'שרון', 'אביעד', 'יריב', 'שגב'];

const DEFAULT_SETTINGS = {
  termsLink: 'https://ufly.co.il/%d7%90%d7%99%d7%a9%d7%95%d7%a8-%d7%aa%d7%a0%d7%90%d7%99-%d7%98%d7%99%d7%a1%d7%94/',
  locationLink: 'https://waze.com/ul/hsv8ze36k5',
  msgTemplateDetails:
`היי {שם} :)
איזה כיף לך, נקבעה עבורך טיסת חוויה בטרקטורון מעופף:
📅 בתאריך: {תאריך}
⏰ שעה: {שעה}
⏳ משך הטיסה: {משך} דקות
✅ הטיסה כוללת: {כולל}

כיף שבחרת לרחף איתנו, צוות יופליי-UFly`,
  msgTemplateTerms:
`בבקשה להקדיש כמה רגעים לקרוא, למלא ולאשר את התקנון 🙏
{קישור_תנאים}`,
  msgTemplateLocation:
`מיקום המנחת:
{קישור_מיקום}`,
  msgTemplatePostpone:
`היי {שם}, בשל תנאי מזג האוויר לא ניתן לקיים את הטיסה במועד שתואם עבורך. אנא צור/י קשר לתאום מועד חדש 🙏🪂`,
  pilotMsgTemplate:
`היי {שם_טייס} :) פנוי לטיסה ב-{תאריך}, {משך} דקות, בשעה {שעה}?`,
  pilotPhones: {}
};

let settings = { ...DEFAULT_SETTINGS, ...JSON.parse(localStorage.getItem(SETTINGS_KEY) || '{}') };

let flights = [];
let currentFilter = 'future';
let editId = null;
let formDuration = 20;
let formCount = 1;
let selectedOptions = new Set();
let selectedPilots = new Set();
let customPilots = [];
let selected = new Set();

function toggleSel(id) { selected.has(id) ? selected.delete(id) : selected.add(id); render(); }
function selectAll() { getFiltered().forEach(f => selected.add(f.id)); render(); }
function clearSel() { selected.clear(); render(); }

// ── Storage (GitHub sync) ────────────────────────────────────────────────────
async function loadFromGithub() {
  try {
    const r = await fetch(`https://api.github.com/repos/${GITHUB_REPO}/contents/${DATA_FILE}`,
      { headers: { Authorization: `token ${GITHUB_TOKEN}`, Accept: 'application/vnd.github.v3+json' } });
    if (r.status === 404) return false;
    const d = await r.json();
    fileSha = d.sha;
    const binary = atob(d.content.replace(/\n/g,''));
    const bytes = new Uint8Array(binary.length);
    for (let i=0; i<binary.length; i++) bytes[i] = binary.charCodeAt(i);
    flights = JSON.parse(new TextDecoder('utf-8').decode(bytes));
    return true;
  } catch(e) { return false; }
}

async function saveToGithub() {
  showSaving();
  const jsonStr = JSON.stringify(flights, null, 2);
  const bytes = new TextEncoder().encode(jsonStr);
  let binary = '';
  bytes.forEach(b => binary += String.fromCharCode(b));
  const content = btoa(binary);
  const body = { message: 'עדכון טיסות', content, ...(fileSha ? { sha: fileSha } : {}) };
  try {
    const r = await fetch(`https://api.github.com/repos/${GITHUB_REPO}/contents/${DATA_FILE}`,
      { method: 'PUT', headers: { Authorization: `token ${GITHUB_TOKEN}`, Accept: 'application/vnd.github.v3+json', 'Content-Type': 'application/json' }, body: JSON.stringify(body) });
    const d = await r.json();
    fileSha = d.content?.sha;
    hideSaving();
  } catch(e) { hideSaving(); }
}

async function loadSettingsFromGithub() {
  try {
    const r = await fetch(`https://api.github.com/repos/${GITHUB_REPO}/contents/${SETTINGS_FILE}`,
      { headers: { Authorization: `token ${GITHUB_TOKEN}`, Accept: 'application/vnd.github.v3+json' } });
    if (r.status === 404) return false;
    const d = await r.json();
    settingsSha = d.sha;
    const binary = atob(d.content.replace(/\n/g,''));
    const bytes = new Uint8Array(binary.length);
    for (let i=0; i<binary.length; i++) bytes[i] = binary.charCodeAt(i);
    const remote = JSON.parse(new TextDecoder('utf-8').decode(bytes));
    settings = { ...DEFAULT_SETTINGS, ...remote };
    localStorage.setItem(SETTINGS_KEY, JSON.stringify(settings));
    return true;
  } catch(e) { return false; }
}

async function saveSettingsToGithub() {
  if (!GITHUB_TOKEN) return;
  const jsonStr = JSON.stringify(settings, null, 2);
  const bytes = new TextEncoder().encode(jsonStr);
  let binary = '';
  bytes.forEach(b => binary += String.fromCharCode(b));
  const content = btoa(binary);
  const body = { message: 'עדכון הגדרות', content, ...(settingsSha ? { sha: settingsSha } : {}) };
  try {
    const r = await fetch(`https://api.github.com/repos/${GITHUB_REPO}/contents/${SETTINGS_FILE}`,
      { method: 'PUT', headers: { Authorization: `token ${GITHUB_TOKEN}`, Accept: 'application/vnd.github.v3+json', 'Content-Type': 'application/json' }, body: JSON.stringify(body) });
    const d = await r.json();
    settingsSha = d.content?.sha;
  } catch(e) {}
}

  catch(e) { flights = []; }

function saveFlights() {

  saveToGithub();

function showSaving() { const el = document.getElementById('save-indicator'); el.textContent = '💾 שומר...'; el.classList.add('visible'); }
function hideSaving() { const el = document.getElementById('save-indicator'); el.textContent = '✅ נשמר!'; setTimeout(() => el.classList.remove('visible'), 1200); }

// ── Google Calendar ──────────────────────────────────────────────────────────
function initGoogleAuth() {
  if (!window.google) return;
  tokenClient = google.accounts.oauth2.initTokenClient({
    client_id: GOOGLE_CLIENT_ID,
    scope: CALENDAR_SCOPE,
    prompt: 'select_account',
    callback: (resp) => {
      if (resp.access_token) {
        gAccessToken = resp.access_token;
        updateCalendarStatus();
        render();
      }
    }
  });
}
function connectGoogle() {
  if (!tokenClient) initGoogleAuth();
  if (tokenClient) tokenClient.requestAccessToken();
}
function connectGoogleAsync() {
  return new Promise((resolve) => {
    if (!tokenClient) initGoogleAuth();
    if (!tokenClient) { resolve(false); return; }
    const originalCallback = tokenClient.callback;
    tokenClient.callback = (resp) => {
      tokenClient.callback = originalCallback;
      if (resp.access_token) {
        gAccessToken = resp.access_token;
        updateCalendarStatus();
        render();
        resolve(true);
      } else {
        resolve(false);
      }
    };
    tokenClient.requestAccessToken();
  });
}
function updateCalendarStatus() {
  const el = document.getElementById('calendar-status');
  if (el) el.textContent = gAccessToken ? '✅ מחובר ליומן גוגל' : '⚪ לא מחובר';
  const btn = document.getElementById('btn-connect-cal');
  if (btn) btn.textContent = gAccessToken ? '✅ מחובר' : '🔗 התחבר ליומן גוגל';
}

function includesLabel(f) {
  return OPTIONS_CFG.filter(o => f[o.key]).map(o => o.label).join(', ') || 'ללא תוספות';
}

function eventSummary(f) {
  const countPrefix = (f.count > 1) ? `${f.count} טיסות · ` : '';
  return `${countPrefix}טיסה · ${f.duration} דק׳ · ${includesLabel(f)}`;
}

function buildCalEvent(f) {
  const [y,m,day] = f.date.split('-');
  const pad = x => String(x).padStart(2,'0');
  const [hh,mm] = f.time.split(':');
  const totalMins = parseInt(hh)*60 + parseInt(mm) + f.duration;
  const startDT = `${y}-${pad(m)}-${pad(day)}T${hh}:${mm}:00`;
  const endDT   = `${y}-${pad(m)}-${pad(day)}T${pad(Math.floor(totalMins/60)%24)}:${pad(totalMins%60)}:00`;

  const summary = eventSummary(f);
  let descParts = [];
  descParts.push(`איש קשר: ${f.contact}${f.phone ? ' | ' + f.phone : ''}`);
  descParts.push(`טיסה · משך ${f.duration} דקות`);
  descParts.push(`כולל: ${includesLabel(f)}`);
  if (f.pilots && f.pilots.length>0) descParts.push(`טייסים: ${f.pilots.join(', ')}`);
  if (f.notes) descParts.push(`הערות: ${f.notes}`);

  return {
    summary,
    description: descParts.join('\n'),
    start: { dateTime: startDT, timeZone: 'Asia/Jerusalem' },
    end:   { dateTime: endDT,   timeZone: 'Asia/Jerusalem' },
    colorId: '5'
  };
}

async function syncCalendarEvent(f) {
  if (!gAccessToken || !f.date || !f.time) return null;
  const event = buildCalEvent(f);
  const idx = flights.findIndex(x => x.id === f.id);

  if (f.calEventId) {
    try {
      const r = await fetch(
        `https://www.googleapis.com/calendar/v3/calendars/primary/events/${f.calEventId}`,
        { method: 'PUT', headers: { 'Authorization': `Bearer ${gAccessToken}`, 'Content-Type': 'application/json' }, body: JSON.stringify(event) }
      );
      if (r.ok) { const d = await r.json(); return d.id; }
      if (r.status !== 404 && r.status !== 410) return null;
      if (idx >= 0) flights[idx].calEventId = null;
    } catch(e) { return null; }
  }

  try {
    const r = await fetch(
      'https://www.googleapis.com/calendar/v3/calendars/primary/events',
      { method: 'POST', headers: { 'Authorization': `Bearer ${gAccessToken}`, 'Content-Type': 'application/json' }, body: JSON.stringify(event) }
    );
    const d = await r.json();
    if (d.id && idx >= 0) {
      flights[idx].calEventId = d.id;
      saveFlights();
      return d.id;
    }
  } catch(e) {}
  return null;
}

async function deleteCalendarEvent(f) {
  if (!f || !f.calEventId) return;
  if (!gAccessToken && window.google) {
    await connectGoogleAsync();
  }
  if (!gAccessToken) return;
  try {
    await fetch(
      `https://www.googleapis.com/calendar/v3/calendars/primary/events/${f.calEventId}`,
      { method: 'DELETE', headers: { 'Authorization': `Bearer ${gAccessToken}` } }
    );
  } catch(e) {}
}

async function handleCalClick(id) {
  const f = flights.find(x => x.id === id);
  if (!f) return;
  if (!f.time) { alert('יש להזין שעת טיסה לפני הוספה ליומן'); return; }

  if (!gAccessToken && window.google) {
    await connectGoogleAsync();
  }

  if (gAccessToken) {
    const indicator = document.getElementById('save-indicator');
    indicator.textContent = '📅 מסנכרן ליומן...';
    indicator.classList.add('visible');
    const hadEvent = !!f.calEventId;
    await syncCalendarEvent(f);
    indicator.textContent = hadEvent ? '📅 יומן עודכן!' : '📅 נוסף ליומן!';
    setTimeout(() => indicator.classList.remove('visible'), 2000);
    render();
  } else if (!f.calEventId) {
    window.open(buildCalUrl(f), '_blank');
  } else {
    alert('כדי לעדכן את האירוע הקיים ביומן יש להתחבר לחשבון Google. התחברי ליומן גוגל בהגדרות (⚙️) ונסי שוב — כך נמנע יצירת אירוע כפול.');
  }
}

function buildCalUrl(f) {
  const [y,m,day] = f.date.split('-');
  const pad = x => String(x).padStart(2,'0');
  const [hh,mm] = f.time.split(':');
  const totalMins = parseInt(hh)*60 + parseInt(mm) + f.duration;
  const start = `${y}${pad(m)}${pad(day)}T${pad(hh)}${mm}00`;
  const end   = `${y}${pad(m)}${pad(day)}T${pad(Math.floor(totalMins/60)%24)}${pad(totalMins%60)}00`;

  const title = encodeURIComponent(eventSummary(f));
  let descParts = [];
  descParts.push(`איש קשר: ${f.contact}${f.phone ? ' | ' + f.phone : ''}`);
  descParts.push(`טיסה · משך ${f.duration} דקות`);
  descParts.push(`כולל: ${includesLabel(f)}`);
  if (f.pilots && f.pilots.length>0) descParts.push(`טייסים: ${f.pilots.join(', ')}`);
  if (f.notes) descParts.push(`הערות: ${f.notes}`);
  const det = encodeURIComponent(descParts.join('\n'));

  return `https://calendar.google.com/calendar/render?action=TEMPLATE&text=${title}&dates=${start}/${end}&details=${det}`;
}

// ── Rendering ───────────────────────────────────────────────────────────────
function fmtDate(d) { if(!d) return ''; const [y,m,day]=d.split('-'); return `${day}/${m}/${y.slice(2)}`; }

function getFiltered() {
  const today = new Date().toISOString().slice(0,10);
  let list = [...flights].sort((a,b) => (a.date+a.time).localeCompare(b.date+b.time));
  if (currentFilter==='future')    return list.filter(f => f.date >= today);
  if (currentFilter==='past')      return list.filter(f => f.date < today);
  return list;
}

function render() {
  const today = new Date().toISOString().slice(0,10);
  const list = getFiltered();
  const el = document.getElementById('flights-list');

  document.getElementById('flight-count').textContent = `${flights.length} טיסות בסה"כ`;

  const btnClear = document.getElementById('btn-clear');
  const btnSendPilots = document.getElementById('btn-send-pilots');
  if (selected.size > 0) {
    btnClear.style.display = '';
    btnSendPilots.style.display = '';
    btnClear.textContent = `נקה בחירה (${selected.size})`;
  } else {
    btnClear.style.display = 'none';
    btnSendPilots.style.display = 'none';
  }

  if (list.length === 0) { el.innerHTML = '<p class="empty">אין טיסות בסינון זה</p>'; return; }

  el.innerHTML = list.map(f => {
    const isPast = f.date < today;
    const optsStr = includesLabel(f);
    const isSel = selected.has(f.id);
    return `
    <div class="flight-card${isPast?' past':''}${isSel?' selected':''}">
      <div class="card-body">
        <div class="checkbox${isSel?' checked':''}" onclick="toggleSel(${f.id})"></div>
        <div class="card-content" onclick="toggleSel(${f.id})">
          <div class="card-top">
            <span class="card-date">${fmtDate(f.date)}${f.time ? ' · ' + f.time : ''}</span>
            <span class="dur-badge">⏱️ ${f.duration} דק׳</span>
            ${f.count > 1 ? `<span class="dur-badge">🔁 ${f.count} טיסות</span>` : ''}
          </div>
          <div class="card-contact">📞 <strong>${f.contact}</strong> <span>${f.phone || ''}</span></div>
          <div class="card-options">✅ ${optsStr}</div>
          ${f.pilots && f.pilots.length>0?`<div class="card-options">🧑‍✈️ ${f.pilots.join(', ')}</div>`:''}
          ${f.notes?`<div class="card-notes">💬 ${f.notes}</div>`:''}
        </div>
        <div class="card-actions">
          <button class="icon-btn" onclick="openEdit(${f.id})">✏️</button>
          <button class="icon-btn" onclick="handleCalClick(${f.id})" title="${f.calEventId?'עדכן אירוע ביומן':'הוסף ליומן'}">${f.calEventId?'📅✅':'📅'}</button>
          <button class="icon-btn" onclick="openSend(${f.id})" title="שלח ללקוח">📤</button>
          <button class="icon-btn" onclick="openPostpone(${f.id})" title="דחיית טיסה עקב מזג אוויר">🌧️</button>
        </div>
      </div>
    </div>`;
  }).join('');
}

  const container = document.getElementById('options-list');

    const isSel = selectedOptions.has(o.key);

  container.innerHTML = allPilots.map(name => {

function togglePilot(name) {

  renderPilotsList();
}
function addCustomPilot() {
  const input = document.getElementById('custom-pilot-input');
  const name = input.value.trim();
  if (!name) return;
  if (!BASE_PILOTS.includes(name) && !customPilots.includes(name)) customPilots.push(name);

function setDuration(d) {

  document.querySelectorAll('#duration-row .toggle-opt').forEach(b => b.classList.toggle('active', parseInt(b.dataset.d) === d));
}

function setCount(c) {

// ── Add / Edit ───────────────────────────────────────────────────────────────
function openAdd() {
  editId = null;
  document.getElementById('modal-title').textContent = '➕ טיסה חדשה';
  document.getElementById('btn-save').textContent = '➕ הוסף טיסה';
  document.getElementById('btn-delete').style.display = 'none';
  ['f-date','f-time','f-contact','f-phone','f-notes'].forEach(id => document.getElementById(id).value = '');
  setDuration(20);
  setCount(1);
  selectedOptions = new Set();
  renderOptionsList();
  selectedPilots = new Set();
  customPilots = [];
  renderPilotsList();
  document.getElementById('modal').classList.add('open');
}

function openEdit(id) {
  const f = flights.find(x => x.id === id);
  if (!f) return;
  editId = id;
  document.getElementById('modal-title').textContent = '✏️ עריכת טיסה';
  document.getElementById('btn-save').textContent = '💾 שמור שינויים';
  document.getElementById('btn-delete').style.display = '';
  document.getElementById('f-date').value = f.date;
  document.getElementById('f-time').value = f.time || '';
  document.getElementById('f-contact').value = f.contact || '';
  document.getElementById('f-phone').value = f.phone || '';
  document.getElementById('f-notes').value = f.notes || '';
  setDuration(f.duration || 20);
  setCount(f.count || 1);
  selectedOptions = new Set(OPTIONS_CFG.filter(o => f[o.key]).map(o => o.key));
  renderOptionsList();
  const savedPilots = f.pilots || [];
  selectedPilots = new Set(savedPilots);
  customPilots = savedPilots.filter(n => !BASE_PILOTS.includes(n));
  renderPilotsList();
  document.getElementById('modal').classList.add('open');
}

function closeModal() { document.getElementById('modal').classList.remove('open'); }

async function saveForm() {
  const date = document.getElementById('f-date').value;
  const time = document.getElementById('f-time').value;
  const contact = document.getElementById('f-contact').value.trim();
  const phone = document.getElementById('f-phone').value.trim();
  if (!date || !time || !contact || !phone) { alert('נא למלא תאריך, שעה, שם איש קשר וטלפון'); return; }

  const data = {
    date, time, contact, phone,
    duration: formDuration,
    count: formCount,
    notes: document.getElementById('f-notes').value.trim(),
    pilots: [...selectedPilots],
    photo: selectedOptions.has('photo'),
    photo360: selectedOptions.has('photo360'),
    pilotDay: selectedOptions.has('pilotDay'),
  };

  let savedId;
  if (editId) {
    const idx = flights.findIndex(x => x.id === editId);
    if (idx >= 0) {
      const calEventId = flights[idx].calEventId || null;
      flights[idx] = { ...data, id: editId, calEventId };
    }
    savedId = editId;
  } else {
    const newId = flights.length > 0 ? Math.max(...flights.map(x => x.id)) + 1 : 1;
    flights.push({ ...data, id: newId, calEventId: null });
    savedId = newId;
  }
  closeModal();
  render();
  saveFlights();
  if (gAccessToken) {
    const f = flights.find(x => x.id === savedId);
    if (f && f.calEventId) { await syncCalendarEvent(f); render(); }
  }
}

async function deleteFlight() {
  if (!confirm('למחוק את הטיסה?')) return;
  const f = flights.find(x => x.id === editId);
  flights = flights.filter(x => x.id !== editId);
  closeModal();
  render();
  saveFlights();
  if (f && f.calEventId) await deleteCalendarEvent(f);
}

// ── Send to client ───────────────────────────────────────────────────────────
let sendFlightId = null;

function fillTemplate(template, f) {
  const [y,m,day] = f.date.split('-');
  let msg = template;
  msg = msg.replaceAll('{שם}', f.contact || '');
  msg = msg.replaceAll('{תאריך}', `${day}/${m}/${y}`);
  msg = msg.replaceAll('{שעה}', f.time || '');
  msg = msg.replaceAll('{משך}', String(f.duration));
  msg = msg.replaceAll('{כולל}', includesLabel(f));
  msg = msg.replaceAll('{קישור_תנאים}', settings.termsLink || '');
  msg = msg.replaceAll('{קישור_מיקום}', settings.locationLink || '');
  return msg;
}

const MSG_SECTIONS = [
  { key: 'details',  title: '1️⃣ פרטי הטיסה',        templateKey: 'msgTemplateDetails' },
  { key: 'terms',    title: '2️⃣ אישור תנאי טיסה',   templateKey: 'msgTemplateTerms' },
  { key: 'location', title: '3️⃣ מיקום המנחת',        templateKey: 'msgTemplateLocation' },
];

function openSend(id) {
  const f = flights.find(x => x.id === id);
  if (!f) return;
  sendFlightId = id;
  document.getElementById('send-title').textContent = `📤 שליחה ל${f.contact}`;
  const phoneDigits = (f.phone || '').replace(/\D/g,'').replace(/^0/, '972');

  document.getElementById('send-body').innerHTML = MSG_SECTIONS.map(sec => {
    const msg = fillTemplate(settings[sec.templateKey] || '', f);
    const waHref = `https://wa.me/${phoneDigits}?text=${encodeURIComponent(msg)}`;
    return `
    <div class="send-section-title">${sec.title}</div>
    <div class="msg-preview" id="msg-preview-${sec.key}">${msg.replace(/</g,'&lt;')}</div>
    <div class="send-btns">
      <button class="btn-copy" id="btn-copy-${sec.key}" onclick="copyMsg('${sec.key}')">📋 העתק</button>
      <a class="btn-wa" href="${waHref}" target="_blank">💬 שלח בוואטסאפ</a>
    </div>`;
  }).join('');

  document.getElementById('send-panel').classList.add('open');
}
function closeSend() { document.getElementById('send-panel').classList.remove('open'); sendFlightId = null; }

// ── Postpone due to weather ──────────────────────────────────────────────────

// ── Send to pilots ───────────────────────────────────────────────────────────
let sendPilotNames = new Set();

function getPilotPhone(name) {

}

function buildPilotMsgFor(pilotName) {

      const msg = buildPilotMsgFor(name);
      const phone = getPilotPhone(name);
      const phoneDigits = phone.replace(/\D/g,'').replace(/^0/, '972');

      const key = `pilot-${name}`;

        <a class="btn-wa" href="${waHref}" target="_blank">💬 שלח בוואטסאפ</a>
      </div>`;

function openSendPilots() {
  if (selected.size === 0) return;
  sendPilotNames = new Set();
  document.getElementById('send-title').textContent = `📤 שליחה לטייסים`;
  renderSendPilotsBody();
  document.getElementById('send-panel').classList.add('open');
}

function copyMsg(key) {
  navigator.clipboard.writeText(document.getElementById(`msg-preview-${key}`).textContent);
  const btn = document.getElementById(`btn-copy-${key}`);
  btn.textContent = '✅ הועתק!'; btn.classList.add('copied');
  setTimeout(() => { btn.textContent = '📋 העתק'; btn.classList.remove('copied'); }, 2000);
}

// ── Settings ─────────────────────────────────────────────────────────────────
function openSettings() {
  document.getElementById('settings-token').value = localStorage.getItem('gh_token') || '';
  document.getElementById('settings-terms').value = settings.termsLink || '';
  document.getElementById('settings-location').value = settings.locationLink || '';
  document.getElementById('settings-template-details').value = settings.msgTemplateDetails || '';
  document.getElementById('settings-template-terms').value = settings.msgTemplateTerms || '';
  document.getElementById('settings-template-location').value = settings.msgTemplateLocation || '';
  document.getElementById('settings-template-postpone').value = settings.msgTemplatePostpone || '';
  document.getElementById('settings-template-pilots').value = settings.pilotMsgTemplate || '';
  renderPilotPhonesList();
  document.getElementById('settings-modal').style.display = 'flex';
}
function closeSettings() { document.getElementById('settings-modal').style.display = 'none'; }
function renderPilotPhonesList() {
  const allPilots = [...BASE_PILOTS, ...customPilots];
  const container = document.getElementById('pilot-phones-list');
  container.innerHTML = allPilots.map(name => `
    <div style="display:flex;align-items:center;gap:8px;margin-bottom:8px">
      <span style="min-width:55px;font-size:14px;color:#374151">${name}</span>
      <input type="tel" class="pilot-phone-input" data-pilot-name="${name.replace(/"/g,'&quot;')}" value="${getPilotPhone(name)}" placeholder="050-1234567" style="flex:1;padding:8px;border:1px solid #D1D5DB;border-radius:8px;font-size:14px;font-family:inherit;direction:ltr">
    </div>`).join('');
}
function saveSettings() {
  const token = document.getElementById('settings-token').value.trim();
  if (token && token !== GITHUB_TOKEN) {
    localStorage.setItem('gh_token', token);
    GITHUB_TOKEN = token;
    fileSha = null;
    init();
  }
  settings.termsLink = document.getElementById('settings-terms').value.trim();
  settings.locationLink = document.getElementById('settings-location').value.trim();
  settings.msgTemplateDetails = document.getElementById('settings-template-details').value;
  settings.msgTemplateTerms = document.getElementById('settings-template-terms').value;
  settings.msgTemplateLocation = document.getElementById('settings-template-location').value;
  settings.msgTemplatePostpone = document.getElementById('settings-template-postpone').value;
  settings.pilotMsgTemplate = document.getElementById('settings-template-pilots').value;
  const phones = {};
  document.querySelectorAll('.pilot-phone-input').forEach(inp => {
    const val = inp.value.trim();
    if (val) phones[inp.dataset.pilotName] = val;
  });
  settings.pilotPhones = phones;
  localStorage.setItem(SETTINGS_KEY, JSON.stringify(settings));
  saveSettingsToGithub();
  closeSettings();
}

// ── Init ─────────────────────────────────────────────────────────────────────
async function init() {
  if (GITHUB_TOKEN) {
    const loaded = await loadFromGithub();
    if (!loaded) {
      loadFlights();
      await saveToGithub();
    }
    const settingsLoaded = await loadSettingsFromGithub();
    if (!settingsLoaded) await saveSettingsToGithub();
  } else {
    loadFlights();
  }
  render();
  if (window.google) initGoogleAuth();
  else window.addEventListener('load', () => { if (window.google) initGoogleAuth(); });
}
function saveToken() {
  const t = document.getElementById('token-input').value.trim();
  if (!t) return;
  localStorage.setItem('gh_token', t);
  GITHUB_TOKEN = t;
  document.getElementById('token-setup').style.display = 'none';
  init();
}
</script>

<!-- Token setup (first time) -->
<div id="token-setup" style="display:none;position:fixed;inset:0;background:rgba(0,0,0,0.6);z-index:999;align-items:center;justify-content:center;direction:rtl">
  <div style="background:white;border-radius:20px;padding:24px;max-width:360px;width:90%;margin:0 16px">
    <h2 style="font-size:20px;font-weight:700;color:#0C4A6E;margin-bottom:8px">🔑 הגדרת חיבור</h2>
    <p style="font-size:15px;color:#64748B;margin-bottom:16px;line-height:1.6">כדי לסנכרן טיסות בין מכשירים יש להכניס את ה-GitHub Token (פעם אחת בלבד)</p>
    <input id="token-input" type="password" placeholder="ghp_..." style="width:100%;padding:10px;border:1px solid #D1D5DB;border-radius:8px;font-size:16px;font-family:inherit;margin-bottom:12px;direction:ltr">
    <button onclick="saveToken()" style="width:100%;padding:13px;background:#0EA5E9;color:white;border:none;border-radius:10px;font-size:17px;font-weight:700;cursor:pointer;font-family:inherit">שמור וחבר</button>
  </div>
</div>
<script>
if (!localStorage.getItem('gh_token')) {
  document.getElementById('token-setup').style.display = 'flex';
} else {
  init();
}
</script>
